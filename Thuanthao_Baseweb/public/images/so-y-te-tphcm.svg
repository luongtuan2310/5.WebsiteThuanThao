<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <path id="textArc" d="M 30,100 A 70,70 0 1,1 170,100" />
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Outer Gold & Red Ring -->
  <circle cx="100" cy="100" r="96" fill="#ffffff" stroke="#da251d" stroke-width="6" filter="url(#shadow)"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#008542" stroke-width="2.5"/>
  
  <!-- Curved Text -->
  <text font-family="'Mulish', 'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="800" fill="#da251d" letter-spacing="0.5">
    <textPath href="#textArc" startOffset="50%" text-anchor="middle">SỞ Y TẾ TP. HỒ CHÍ MINH</textPath>
  </text>
  
  <!-- Red Star at Top -->
  <polygon points="100,16 103,24 111,24 105,29 107,37 100,32 93,37 95,29 89,24 97,24" fill="#da251d"/>

  <!-- Inner Green Circle -->
  <circle cx="100" cy="114" r="54" fill="#008542"/>
  <circle cx="100" cy="114" r="50" fill="none" stroke="#ffffff" stroke-width="2"/>
  
  <!-- White Cross -->
  <rect x="91" y="80" width="18" height="68" rx="4" fill="#ffffff"/>
  <rect x="66" y="105" width="68" height="18" rx="4" fill="#ffffff"/>
  
  <!-- Red Caduceus Staff & Snake -->
  <line x1="100" y1="74" x2="100" y2="152" stroke="#da251d" stroke-width="4" stroke-linecap="round"/>
  <path d="M 94,76 C 112,88 112,102 94,114 C 112,126 112,140 98,150" fill="none" stroke="#da251d" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="100" cy="72" r="4" fill="#da251d"/>
</svg>